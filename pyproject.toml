[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
# Distribution name, NOT the import name. `import homestead` is unchanged (see
# [tool.hatch.build.targets.wheel] below) — this is only what you `pip install`.
# The bare `homestead` on PyPI is an unrelated, abandoned 2022 package, so the
# engine publishes as `homestead-affairs` (the face's name). Same split as
# scikit-learn/sklearn: the wheel is named for the distribution, the code for the
# import. homestead-law depends on THIS name.
name = "homestead-affairs"
# The git tag is the single source of truth — see [tool.hatch.version]. The
# version is deliberately NOT a literal here. `homestead/__init__.py` used to
# carry `__version__ = "0.0.1"`; a number nothing derives is a number that goes
# stale, and homestead-law then pins whatever it says. hatch-vcs derives it from
# the tag instead, so there is exactly one place a release number is decided.
dynamic = ["version"]
description = "The seat of Homestead · Affairs — the shared record, deadline and evidence core (homestead.keep)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["record", "deadline", "evidence", "self-represented", "legal-aid", "homestead"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Legal Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Office/Business",
]

# I-27: declared dependencies are TRUE. A cold checkout runs `pip install -e .`
# and then bare `pytest -q`, with no out-of-band install step and no CI escape
# hatch — so anything imported has to be named here.
#
# `holidays` is the first real dependency in this repo (Phase 1). MIT, verified
# from the installed distribution's own metadata by
# tests/test_invariants_dates.py, not from a report about it. It brings
# `python-dateutil` (Apache-2.0 / BSD-3-Clause dual) which brings `six` (MIT) —
# three packages, all pure Python, no compiled extensions, no network code.
#
# FRCP 6(a)(6) defines "legal holiday" as the federal holidays; this is that
# calendar. The counting rules themselves are ours, in homestead/keep/dates.py,
# because no open-source Python court-deadline engine exists to depend on.
#
# `dateutil` arrives transitively and MUST NOT be imported: `dateutil.parser`
# invents missing components from today ('2026' -> 2026-08-04), which is BUG-1
# inverted. test_i1_i2_nothing_else_in_this_package_parses_a_date enforces it.
#
# The floor is the version this was verified against, not the oldest that might
# work. The cap is because python-holidays is pre-1.0 and this is a dependency
# that decides when a court deadline falls.
dependencies = ["holidays>=0.102,<1.0"]

[project.optional-dependencies]
# `pyyaml` and `tomli` are for tests/test_release_wiring.py, which reads the
# release workflows and pyproject to check the four release files agree. It
# importorskips on yaml, so leaving pyyaml out would turn those checks into a
# silent skip — the exact failure mode they exist to catch. Dev-only, so I-27's
# runtime-dependency promise (the `dependencies` list above) is untouched.
dev = ["pytest>=8.0", "pyyaml", "tomli; python_version<'3.11'"]
# Nestor is an OPTIONAL EXTRA and never a required dependency.
# The seam degrades to feature-absent when it is not installed.
entity = []          # pinned nestor lands here at Phase 6+

[project.scripts]
homestead-law = "homestead.app.__main__:main"

[project.urls]
Homepage = "https://github.com/rudi193-cmd/homestead"
Repository = "https://github.com/rudi193-cmd/homestead"
Issues = "https://github.com/rudi193-cmd/homestead/issues"
Changelog = "https://github.com/rudi193-cmd/homestead/blob/main/CHANGELOG.md"

[tool.hatch.version]
# Derived from the git tag (hatch-vcs). At an exact tag `vX.Y.Z` the version is
# X.Y.Z; off-tag builds get a `.devN+g<sha>` suffix that PyPI rejects, so an
# accidental publish from an untagged commit fails loudly instead of shipping
# something mislabelled. CI must check out with `fetch-depth: 0` — the default
# shallow checkout carries no tags and the derived version would be wrong.
#
# No tag exists yet: this repo has never published. `.release-please-manifest.json`
# anchors the current version at 0.0.1 (what the code already called itself), and
# release-please cuts the first real tag from the commits (`release-type: simple`,
# release-please-config.json) rather than anyone tagging by hand — PyPI never lets
# a version be reused.
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["homestead"]

[tool.pytest.ini_options]
# I-28: bare `pytest -q` must work. Nothing shadows the live suite.
testpaths = ["tests"]
norecursedirs = ["_archived", "build", "dist", ".git", "packaging"]
