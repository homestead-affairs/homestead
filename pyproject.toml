[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
# Distribution name, NOT the import name. `import homestead` is unchanged (see
# [tool.hatch.build.targets.wheel] below) — this is only what you `pip install`.
# The bare `homestead` on PyPI is an unrelated, abandoned 2022 package, so the
# engine publishes as `homestead-affairs` (the face's name). Same split as
# scikit-learn/sklearn: the wheel is named for the distribution, the code for the
# import. homestead-law depends on THIS name.
name = "homestead-affairs"
# The git tag is the single source of truth — see [tool.hatch.version]. The
# version is deliberately NOT a literal here. `homestead/__init__.py` used to
# carry `__version__ = "0.0.1"`; a number nothing derives is a number that goes
# stale, and homestead-law then pins whatever it says. hatch-vcs derives it from
# the tag instead, so there is exactly one place a release number is decided.
dynamic = ["version"]
description = "The seat of Homestead · Affairs — the shared record, deadline and evidence core (homestead.keep)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["record", "deadline", "evidence", "self-represented", "legal-aid", "homestead"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Legal Industry",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Office/Business",
]

# I-27: declared dependencies are TRUE. A cold checkout runs `pip install -e .`
# and then bare `pytest -q`, with no out-of-band install step and no CI escape
# hatch — so anything imported has to be named here.
#
# `holidays` is the first real dependency in this repo (Phase 1). MIT, verified
# from the installed distribution's own metadata by
# tests/test_invariants_dates.py, not from a report about it. It brings
# `python-dateutil` (Apache-2.0 / BSD-3-Clause dual) which brings `six` (MIT) —
# three packages, all pure Python, no compiled extensions, no network code.
#
# FRCP 6(a)(6) defines "legal holiday" as the federal holidays; this is that
# calendar. The counting rules themselves are ours, in homestead/keep/dates.py,
# because no open-source Python court-deadline engine exists to depend on.
#
# `dateutil` arrives transitively and MUST NOT be imported: `dateutil.parser`
# invents missing components from today ('2026' -> 2026-08-04), which is BUG-1
# inverted. test_i1_i2_nothing_else_in_this_package_parses_a_date enforces it.
#
# The floor is the version this was verified against, not the oldest that might
# work. The cap is because python-holidays is pre-1.0 and this is a dependency
# that decides when a court deadline falls.
dependencies = ["holidays>=0.102,<1.0"]

[project.optional-dependencies]
# `pyyaml` and `tomli` are for tests/test_release_wiring.py, which reads the
# release workflows and pyproject to check the four release files agree. It
# importorskips on yaml, so leaving pyyaml out would turn those checks into a
# silent skip — the exact failure mode they exist to catch. Dev-only, so I-27's
# runtime-dependency promise (the `dependencies` list above) is untouched.
dev = ["pytest>=8.0", "pyyaml", "tomli; python_version<'3.11'"]
# Nestor is an OPTIONAL EXTRA and never a required dependency.
# The seam (homestead/keep/nestor_seam.py) degrades to feature-absent when it
# is not installed: nothing in this package imports `nestor` at module load,
# so a checkout without this extra still imports and runs the whole suite.
# Pinned to a PyPI release range (was a VCS tag at v0.2.0; the published
# wheel is nestor-meaning, import name `nestor`). The API surface this seam
# calls (EntityResolver, set_ledger_path, ledger.verify) is stable across
# the 0.2 -> 0.11 range — no code change required in nestor_seam.py.
entity = ["nestor-meaning>=0.11.0,<1.0"]
# The fleet side's own extra (E4-postgres-fleet, decision 5): a Postgres
# driver, never a required dependency of the household side. `keep/store.py`'s
# `PostgresAdapter` and `keep/fleet_cli.py` import `psycopg` lazily, inside a
# function, never at module load — `test_i27_the_core_needs_nothing_but_the_
# standard_library` and I-39's own guard (tests/test_invariants_fleet.py) both
# check for it — so a checkout without this extra still imports `store.py` and
# `fleet_cli.py`, and only fails, by name, the moment something tries to
# construct `PostgresAdapter`. `[binary]` ships a prebuilt libpq rather than
# requiring one on the machine that runs `homestead-fleet ingest`.
fleet = ["psycopg[binary]>=3.1,<4"]
# Phase 4 sealing (E6-integrity-encrypt, decision 6): AES-256-GCM per line
# over an `IntegrityLog`, key derived by HKDF from the existing keyed-chain
# key (`homestead/keep/sealed.py`). Pure-Python AEAD is not an option — no
# audited, maintained one exists — so this is the one place the engine
# reaches for a compiled dependency at all. `keep/sealed.py` imports
# `cryptography` lazily, inside functions, never at module load
# (`test_i27_...` in `tests/test_invariants_sealed.py` and I-27 both check
# this): a checkout without the extra still imports `sealed.py` and every
# module that imports it, and only fails, by name, the moment sealing or
# unsealing is actually attempted. Floor is the version this was verified
# against (HKDF and AESGCM are both stable well before it); the cap follows
# the same "verified against, not indefinitely trusted" posture as the
# `holidays` and `psycopg` ranges above.
sealed = ["cryptography>=42,<51"]

[project.scripts]
# ~~homestead-law = "homestead.app.__main__:main"~~ (struck 2026-09-11): the
# engine's own console script collided by name with homestead-law's own
# `homestead-law` console script — whichever package installed second silently
# overwrote the other's entry point. The engine's script is named for the
# engine.
homestead = "homestead.app.__main__:main"
# The fleet side's own entry point (E4-postgres-fleet) — never installed or
# run by the household side, which never holds a DSN (open item 7 of the
# affairs build plan). See docs/DECISION-fleet-ingest.md.
homestead-fleet = "homestead.keep.fleet_cli:main"

[project.urls]
Homepage = "https://github.com/homestead-affairs/homestead"
Repository = "https://github.com/homestead-affairs/homestead"
Issues = "https://github.com/homestead-affairs/homestead/issues"
Changelog = "https://github.com/homestead-affairs/homestead/blob/main/CHANGELOG.md"

[tool.hatch.metadata]
# The `entity` extra pins Nestor by a direct VCS reference (a tag, never a
# branch — fleet rule R14), which hatchling refuses to build without this flag
# set explicitly (it defaults to false because a direct reference is not
# resolvable from a plain index like PyPI). Scoped narrowly: this is what lets
# `pip install -e .` succeed at all once the reference exists in
# optional-dependencies, even for an install that never selects `[entity]` —
# hatchling validates every field's metadata at build time, not just the
# extras a caller asked for.
allow-direct-references = true

[tool.hatch.version]
# Derived from the git tag (hatch-vcs). At an exact tag `vX.Y.Z` the version is
# X.Y.Z; off-tag builds get a `.devN+g<sha>` suffix that PyPI rejects, so an
# accidental publish from an untagged commit fails loudly instead of shipping
# something mislabelled. CI must check out with `fetch-depth: 0` — the default
# shallow checkout carries no tags and the derived version would be wrong.
#
# No tag exists yet: this repo has never published. `.release-please-manifest.json`
# anchors the current version at 0.0.1 (what the code already called itself), and
# release-please cuts the first real tag from the commits (`release-type: simple`,
# release-please-config.json) rather than anyone tagging by hand — PyPI never lets
# a version be reused.
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["homestead"]

[tool.pytest.ini_options]
# I-28: bare `pytest -q` must work. Nothing shadows the live suite.
testpaths = ["tests"]
norecursedirs = ["_archived", "build", "dist", ".git", "packaging"]
# `fleet`: needs a live Postgres (`HOMESTEAD_FLEET_TEST_DSN`) — registered so
# `pytest -q` never warns about an unknown marker, and so CI's `fleet` job can
# select exactly this set with `-m fleet`. tests/test_fleet_postgres.py skips
# (not fails) when the env var is unset, which is what keeps the default
# `invariants` matrix psycopg-free (I-27).
markers = ["fleet: requires a live Postgres via HOMESTEAD_FLEET_TEST_DSN"]
