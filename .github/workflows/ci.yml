name: ci
on: [push, pull_request]

jobs:
  invariants:
    # I-27/I-28: a cold checkout, nothing but pytest, bare `pytest -q`.
    # No out-of-band install step. If this job needs one, the declared
    # dependencies are false and that is the finding.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pytest
      - run: pip install -e .
      - run: pytest -q
